name: Build

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android — build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # ИСПРАВЛЕНО: понижено до v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # ИСПРАВЛЕНО: понижено до v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug env
        run: |
          java -version
          ./gradlew --version
          ls -la
          cat app/build.gradle.kts | head -n 100

      - name: Build Debug APK
        # ИСПРАВЛЕНО: убран continue-on-error: true, чтобы сборка падала при реальных ошибках кода
        # ИСПРАВЛЕНО: убран | tail -n 200, чтобы видеть полные логи ошибок
        run: ./gradlew :app:assembleDebug --stacktrace --info

      - name: Run Android unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace || echo "tests failed, see above"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigmaflux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # ИСПРАВЛЕНО: понижено до v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt # ИСПРАВЛЕНО: добавлен путь к файлу зависимостей

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
          pip list | grep -E "fastapi|httpx|pytest|ccxt"

      - name: Compile check
        run: python -m py_compile backend/app/main.py backend/app/schemas.py backend/app/providers/*.py

      - name: Run backend tests
        continue-on-error: true
        working-directory: backend
        run: pytest tests -v --tb=long

      - name: Debug backend on failure
        if: failure()
        working-directory: backend
        run: |
          echo "=== pip list ===" && pip list
          echo "=== cat requirements ===" && cat requirements.txt
          echo "=== pytest verbose ===" && pytest tests -v --tb=long || true
